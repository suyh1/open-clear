name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select build tools
        shell: pwsh
        run: |
          "JAVA_HOME=$env:JAVA_HOME_21_X64" >> $env:GITHUB_ENV
          "$env:JAVA_HOME_21_X64/bin" >> $env:GITHUB_PATH
          "ANDROID_JAR=$env:ANDROID_HOME/platforms/android-35/android.jar" >> $env:GITHUB_ENV
          "BUILD_TOOLS=$env:ANDROID_HOME/build-tools/35.0.0" >> $env:GITHUB_ENV

      - name: Build CI APK
        if: github.ref_type != 'tag'
        shell: pwsh
        run: ./build.ps1 -AndroidJar $env:ANDROID_JAR -BuildTools $env:BUILD_TOOLS

      - name: Build route instrumentation for manual UI checks
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        shell: pwsh
        run: |
          ./build.ps1 -AndroidJar $env:ANDROID_JAR -BuildTools $env:BUILD_TOOLS -ProjectRoot qa/route-test
          Move-Item -LiteralPath qa/route-test/Chumen.apk -Destination RouteChecks.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        with:
          name: route-checks-apk
          path: RouteChecks.apk
          retention-days: 1

      - name: Build and verify release APK
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.CHUMEN_KEYSTORE_BASE64 }}
          CHUMEN_SIGN_PASS: ${{ secrets.CHUMEN_SIGN_PASS }}
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v([1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$') {
            throw 'Expected a release tag such as v1.2.3'
          }
          $code = [int]$Matches[1] * 1000000 + [int]$Matches[2] * 1000 + [int]$Matches[3]
          $key = Join-Path $env:RUNNER_TEMP 'chumen-release.p12'
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            Remove-Item Env:KEYSTORE_BASE64
            ./build.ps1 -AndroidJar $env:ANDROID_JAR -BuildTools $env:BUILD_TOOLS -SigningKey $key -VersionName $env:GITHUB_REF_NAME.Substring(1) -VersionCode $code
            $cert = & "$env:BUILD_TOOLS/apksigner.bat" verify --print-certs Chumen.apk
            if ($LASTEXITCODE -ne 0 -or $cert -notcontains 'Signer #1 certificate SHA-256 digest: e4d0babaf4519f4fbb681f8b952bc3c306135f4feb4d32aeeda43d7f29b15925') {
              throw 'APK signer does not match the original family app.'
            }
          } finally {
            Remove-Item -LiteralPath $key -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chumen-apk
          path: Chumen.apk
          if-no-files-found: error
          retention-days: 7

  check-ui:
    if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: chumen-apk
      - name: Enable hardware acceleration on the hosted runner
        run: sudo chmod 666 /dev/kvm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: route-checks-apk
      - uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: python3 qa/check_ui.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-ui
          path: ui-captures/
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chumen-apk
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Chumen.apk --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "出门 ${GITHUB_REF_NAME#v}" --notes "在安卓手机上下载并安装 Chumen.apk，桌面点「出门」即可查公交地铁或打车。"
